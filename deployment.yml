apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-deployment
  labels:
    app: app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: 512741003479.dkr.ecr.us-east-1.amazonaws.com/project_ecr:81cb6d9c479d9dcb2b08fa15b2c3be649508e284
        ports:
          - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: app-lb
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
