name: push to ecr

on:
  push:
    branches: main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: project_ecr
  AWS_ACCOUNT_ID: 512741003479

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{env.AWS_REGION}}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN}}

      - name: login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 512741003479.dkr.ecr.us-east-1.amazonaws.com

      - name: build & tag image
        run: |
          IMAGE_URL="${{env.AWS_ACCOUNT_ID}}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}}:${{github.sha}}"
          docker build -t $IMAGE_URL .
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB>ENV
      - name: push to ECR
        run: |
          docker push ${{ env.IMAGE_URL }}
